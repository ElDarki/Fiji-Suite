# Builds Fiji Suite for Windows, Linux and Flatpak.
# On a tag like v1.2.3 (or v1.2.3-beta1) it also publishes a GitHub release with the three files and the
# matching CHANGELOG.md section. Pushes to main and manual runs only build, so a broken build shows up
# before you tag.
name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  version:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        shell: bash
        run: |
          version="$(jq -r .version buildspec.json)"
          manifest="$(jq -r .version data/manifest.json)"
          metainfo="$(grep -oP '<release version="\K[^"]+' build-aux/flatpak/com.obsproject.Studio.Plugin.FijiSuite.metainfo.xml | head -n1)"
          echo "buildspec.json: $version, manifest.json: $manifest, metainfo.xml: $metainfo"
          fail=0
          [[ "$manifest" == "$version" ]] || { echo "::error::data/manifest.json says $manifest, buildspec.json says $version"; fail=1; }
          [[ "$metainfo" == "$version" ]] || { echo "::error::the Flatpak metainfo.xml says $metainfo, buildspec.json says $version"; fail=1; }
          prerelease=false
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="${GITHUB_REF_NAME#v}"
            base="${tag%%-*}"
            [[ "$base" == "$version" ]] || { echo "::error::tag $GITHUB_REF_NAME does not match version $version in buildspec.json"; fail=1; }
            [[ "$tag" == *-* ]] && prerelease=true
            grep -q "^## $base\$" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $base' section"; fail=1; }
          fi
          (( fail == 0 )) || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Build
        shell: pwsh
        run: |
          cmake --preset windows-x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build_x64 --config RelWithDebInfo --parallel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install build_x64 --config RelWithDebInfo --prefix stage
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package (MSI installer)
        # WiX v5 builds an .msi that installs into C:\ProgramData\obs-studio\plugins\fiji-suite (build-aux/windows).
        shell: pwsh
        run: |
          if (-not (Test-Path stage/fiji-suite/bin/64bit/fiji-suite.dll)) { throw 'fiji-suite.dll missing from the install' }
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force out | Out-Null
          wix build build-aux/windows/fiji-suite.wxs -arch x64 `
            -d Version=${{ needs.version.outputs.version }} -d Stage=stage\fiji-suite `
            -o "out/fiji-suite-${{ needs.version.outputs.version }}-windows-x64.msi"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Remove-Item out/*.wixpdb -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: out/*

  linux:
    name: Linux x86_64 (Ubuntu 24.04)
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo add-apt-repository --yes ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config \
            libgles2-mesa-dev libsimde-dev obs-studio qt6-base-dev qt6-base-private-dev libqt6svg6-dev \
            libcurl4-openssl-dev
      - name: Importer tests
        run: node tests/import.test.js
      - name: Architecture rules
        run: python3 tools/check-architecture.py
      - name: Build
        run: |
          cmake --preset ubuntu-x86_64 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build build_x86_64 --parallel
          cmake --install build_x86_64 --prefix "$PWD/stage"
      - name: Unit and architecture tests
        run: |
          cmake --build build_x86_64 --parallel --target fiji-arch-test fiji-core-test decks-engine-test
          ctest --test-dir build_x86_64 --output-on-failure
      - name: Package
        # Same layout as ~/.config/obs-studio/plugins/fiji-suite expects: bin/64bit and data.
        run: |
          so="$(find stage -name fiji-suite.so | head -n1)"
          data="$(find stage -type d -path '*/obs-plugins/fiji-suite' | head -n1)"
          [[ -n "$so" && -n "$data" ]] || { echo "::error::install did not produce fiji-suite.so and its data"; find stage; exit 1; }
          mkdir -p pkg/fiji-suite/bin/64bit pkg/fiji-suite/data out
          cp "$so" pkg/fiji-suite/bin/64bit/
          cp -r "$data"/. pkg/fiji-suite/data/
          tar -czf "out/fiji-suite-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz" -C pkg fiji-suite
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: out/*

  flatpak:
    name: Flatpak
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Flatpak and the OBS runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sdk="$(jq -r .sdk build-aux/flatpak/com.obsproject.Studio.Plugin.FijiSuite.json)"
          flatpak install --user -y --noninteractive flathub com.obsproject.Studio//stable "$sdk"
      - name: Build
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean --repo=repo build \
            build-aux/flatpak/com.obsproject.Studio.Plugin.FijiSuite.json
          mkdir -p out
          flatpak build-bundle --runtime repo "out/fiji-suite-${{ needs.version.outputs.version }}-linux-flatpak.flatpak" \
            com.obsproject.Studio.Plugin.FijiSuite stable
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: out/*

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [version, windows, linux, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Write release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          {
            if [[ "$VERSION" == 0.* ]]; then
              echo "**Beta.** Export your scene collection before installing (Scene Collection → Export)."
              echo
            fi
            awk -v v="## $VERSION" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md
            echo
            echo "Install steps for each file are in the [README](https://github.com/${GITHUB_REPOSITORY}#install)."
            echo
            echo "### SHA-256"
            echo
            echo '```'
            (cd dist && sha256sum *)
            echo '```'
          } > notes.md
          cat notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          title="Fiji Suite $VERSION"
          [[ "$VERSION" == 0.* ]] && title="$title Beta"
          flags=()
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$title" --notes-file notes.md "${flags[@]}"
          fi
