<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiji Suite deck editor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="deck-head">
  <nav class="deck-tabs" id="tabs" aria-label="Decks"></nav>
  <div class="deck-actions" id="actions"></div>
</header>
<div class="editor">
  <main class="deck-body"><div class="keys editing" id="deck"></div></main>
  <aside class="panel" aria-label="Deck and key settings">
    <div class="panel-body" id="side"></div>
    <div class="savebar" id="savebar"></div>
  </aside>
</div>
<input type="file" id="sammi-file" accept=".json,application/json" hidden>
<script src="fiji.js"></script>
<script src="steps.js"></script>
<script src="import.js"></script>
<script src="editor.js"></script>
</body>
</html>
